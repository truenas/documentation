<div class="container stickyelement" id="stickymenu">
  <div class="stickybackground">
    <div class="docsnav">
      <span class="docshome"><a href="https://www.truenas.com/docs/">Documentation Hub</a></span>
      <div class="truenas-menubar" style="float:right;">
        <div class="truenas-docsnav-menuitem" id="products" onmouseover="showProductOptions()" onmouseout="hideProductOptions()">
          <button class="truenas-docsnav-menubutton" id="productButton" data-product-id="">Product <i class="fa fa-angle-down"></i></button>
          <div class="truenas-navmenudropdown" id="productDropdown">
            <div class="truenas-dropdown-item" onclick="selectProduct('TrueNAS')" data-id="truenas">TrueNAS</div>
            <a class="truenas-dropdown-item" href="https://apps.truenas.com" target="_blank">TrueNAS Apps</a>
            <a class="truenas-dropdown-item" href="https://connect.truenas.com" target="_blank">TrueNAS Connect</a>
            <div class="truenas-dropdown-item" onclick="selectProduct('TrueCommand')" data-id="truecommand">TrueCommand</div>
            <div class="truenas-dropdown-item" onclick="selectProduct('TrueNAS Systems')" data-id="hardware">TrueNAS Systems</div>
          </div>
        </div>
        <div class="truenas-docsnav-menuitem" id="versions" onmouseover="showVersionOptions()" onmouseout="hideVersionOptions()">
          <button class="truenas-docsnav-menubutton" id="versionButton" disabled><span id="selectedVersionPlaceholder">Version <i class="fa fa-angle-down"></i></span></button>
          <div class="truenas-navmenudropdown" id="versionDropdown" style="display: none;">
            <!-- Version dropdown options dynamically load -->
          </div>
        </div>
        <!-- Search Buttons (Split Design) -->
        <div class="docsnav-search-container">
          <button id="search-trigger" class="docsnav-search-btn docsnav-search-left" aria-label="Keyword Search" title="Keyword Search">
            <i class="fa fa-search"></i>
            <span>Keyword Search</span>
          </button>
          <button id="chatbot-open-button" class="docsnav-search-btn docsnav-search-right" aria-label="Conversational Search" title="Conversational Search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <!-- Chat bubble -->
              <path d="M20 2H4C2.9 2 2 2.9 2 4V16C2 17.1 2.9 18 4 18H7L12 22L17 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" stroke="currentColor" stroke-width="2" fill="none"/>
              <!-- Three dots inside (typing indicator) -->
              <circle cx="8" cy="10" r="1.5" fill="currentColor"/>
              <circle cx="12" cy="10" r="1.5" fill="currentColor"/>
              <circle cx="16" cy="10" r="1.5" fill="currentColor"/>
            </svg>
            <span>AI Search</span>
          </button>
        </div>
        <!-- disable placeholder translate element for future work <div id="google_translate_element"></div> -->
        <span id="gdoc-color-theme" style="display:flex;align-items:center;justify-content:center;">
          <svg class="gdoc-icon gdoc_brightness_dark" style="width:30px;height:30px;">
            <title>{{ i18n "button_toggle_dark" }}</title>
            <use xlink:href="#gdoc_brightness_dark"></use>
          </svg>
          <svg class="gdoc-icon gdoc_brightness_light" style="width:30px;height:30px;">
            <title>{{ i18n "button_toggle_dark" }}</title>
            <use xlink:href="#gdoc_brightness_light"></use>
          </svg>
          <svg class="gdoc-icon gdoc_brightness_auto" style="width:30px;height:30px;">
            <title>{{ i18n "button_toggle_dark" }}</title>
            <use xlink:href="#gdoc_brightness_auto"></use>
          </svg>
        </span>
      </div>
    </div>
  </div>
</div>

<script src="{{ "/js/version-switcher.js" | relURL }}"></script>
<script>
  // Product and version menus.
  // Version locations, labels and menu entries come from the shared registry in js/version-switcher.js
  // (served copy: /docs/versions.json), so a new release or the "Latest" entry is a registry edit.
  // Cross-version navigation is VersionSwitcher.switchVersion (page maps, no modal).

  // Used only if js/version-switcher.js did not load.
  var TN_FALLBACK_ROOTS = {
    'nightly': '/docs/scale/',
    '27': '/docs/scale/27/',
    '25.10': '/docs/scale/25.10/',
    '25.04': '/docs/scale/25.04/',
    '13.0': '/docs/core/13.0/',
    '3.0': '/docs/truecommand/3.0/',
    'archive': '/docs/archive/'
  };

  function hasSwitcher() {
    return typeof window.VersionSwitcher === 'object' && window.VersionSwitcher !== null;
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function updateDropdownPlaceholderText() {
    var path = window.location.pathname;
    var productButton = document.getElementById('productButton');
    var versionButton = document.getElementById('versionButton');
    var versionDropdown = document.getElementById('versionDropdown');
    var version = hasSwitcher() ? window.VersionSwitcher.parseLocation(path).version : null;
    var versionUpdated = false;

    if (version) {
      var isTrueCommand = version.product === 'truecommand' || version.family === 'truecommand';
      productButton.innerHTML = (isTrueCommand ? 'TrueCommand' : 'TrueNAS') + ' <i class="fa fa-angle-down"></i>';
      versionButton.textContent = window.VersionSwitcher.labelFor(path);
      versionUpdated = true;
    } else if (path.includes('/core/') || path.includes('/scale/')) {
      productButton.innerHTML = 'TrueNAS <i class="fa fa-angle-down"></i>';
    } else if (path.includes('/truecommand/')) {
      productButton.innerHTML = 'TrueCommand <i class="fa fa-angle-down"></i>';
    } else if (path.includes('/hardware/')) {
      productButton.innerHTML = 'TrueNAS Systems <i class="fa fa-angle-down"></i>';
      versionButton.textContent = '---';
      versionUpdated = true;
    } else {
      productButton.innerHTML = 'Product <i class="fa fa-angle-down"></i>';
    }

    if (!versionUpdated) {
      versionButton.innerHTML = 'Version <i class="fa fa-angle-down"></i>';
    }

    versionDropdown.textContent = 'Choose a Product';
  }

  updateDropdownPlaceholderText();

  // Menu markup from the registry: groups in order, headers only when the menu has several release groups.
  function versionMenuHtml(menu) {
    var headers = { next: 'Next', current: 'Current', previous: 'Previous' };
    var groups = [];
    window.VersionSwitcher.dropdownItems(menu).forEach(function (item) {
      if (!/^[\w.\-]+$/.test(item.id)) { return; }
      var last = groups[groups.length - 1];
      if (last && last.group === item.group) {
        last.items.push(item);
      } else {
        groups.push({ group: item.group, items: [item] });
      }
    });
    var showHeaders = groups.filter(function (g) { return headers[g.group]; }).length > 1;

    return groups.map(function (g) {
      var html = '';
      if (g.group === 'archive') {
        if (showHeaders) { html += '<hr class="no-version-line">'; }
      } else if (showHeaders && headers[g.group]) {
        html += '<div class="version-header"><small class="version-label">' + headers[g.group] + '</small><hr class="version-line"></div>';
      }
      g.items.forEach(function (item) {
        html += '<div class="truenas-dropdown-item" onclick="selectVersion(\'' + item.id + '\')" id="version-' +
          item.id.replace(/\./g, '') + '">' + escapeHtml(item.label) + '</div>';
      });
      return '<div class="truenas-version-group">' + html + '</div>';
    }).join('');
  }

  // Used only if js/version-switcher.js did not load: a plain menu so the reader can still switch versions.
  function fallbackLabel(id) {
    return id === 'nightly' ? '28' : (id === 'archive' ? 'Archive' : id);
  }

  function fallbackMenuHtml(menu) {
    var ids = menu === 'TrueCommand' ? ['3.0', 'archive'] : ['nightly', '27', '25.10', '25.04', '13.0', 'archive'];
    return '<div class="truenas-version-group">' + ids.map(function (id) {
      return '<div class="truenas-dropdown-item" onclick="selectVersion(\'' + id + '\')" id="version-' +
        id.replace(/\./g, '') + '">' + fallbackLabel(id) + '</div>';
    }).join('') + '</div>';
  }

  function selectProduct(product) {
    var productButton = document.getElementById('productButton');
    var versionButton = document.getElementById('versionButton');
    var versionDropdown = document.getElementById('versionDropdown');

    versionButton.innerHTML = 'Version <i class="fa fa-angle-down"></i>';
    versionButton.dataset.versionId = '';

    productButton.innerHTML = product + ' <i class="fa fa-angle-down"></i>';
    productButton.dataset.productId = product.toLowerCase().replace(/\s/g, ''); // Store the selected product ID

    var docsnavIntro = document.getElementById('docsnav-intro');
    if (docsnavIntro) {
      docsnavIntro.textContent = 'Product and Version:';
    }

    if (product === 'TrueNAS Systems') {
      window.location.href = 'https://www.truenas.com/docs/hardware';
      return;
    }

    versionButton.disabled = false;
    versionDropdown.style.display = 'none';
    versionDropdown.innerHTML = '';

    if (product === 'TrueNAS' || product === 'TrueCommand') {
      versionDropdown.innerHTML = hasSwitcher() ? versionMenuHtml(product) : fallbackMenuHtml(product);
    }

    versionDropdown.style.display = 'block';

    var productDropdown = document.getElementById('productDropdown');
    productDropdown.style.display = 'none';
  }

  function selectVersion(id) {
    var versionButton = document.getElementById('versionButton');
    versionButton.dataset.versionId = id;

    var label = fallbackLabel(id);
    if (hasSwitcher()) {
      ['TrueNAS', 'TrueCommand'].forEach(function (menu) {
        window.VersionSwitcher.dropdownItems(menu).forEach(function (item) {
          if (item.id === id) { label = item.label; }
        });
      });
    }
    versionButton.textContent = label;
    document.getElementById('versionDropdown').style.display = 'none';

    if (hasSwitcher()) {
      window.VersionSwitcher.switchVersion(id);
    } else if (TN_FALLBACK_ROOTS[id]) {
      window.location.assign(TN_FALLBACK_ROOTS[id]);
    }
  }

  function showProductOptions() {
    var productDropdown = document.getElementById('productDropdown');
    productDropdown.style.display = 'block';
  }

  function hideProductOptions() {
    var productDropdown = document.getElementById('productDropdown');
    productDropdown.style.display = 'none';
  }

  function showVersionOptions() {
    var productButton = document.getElementById('productButton');
    var product = productButton.textContent.trim();
    var versionDropdown = document.getElementById('versionDropdown');

    if (product) {
      versionDropdown.style.display = product.toLowerCase() === 'truenas systems' ? 'none' : 'block';
    } else {
      versionDropdown.style.display = 'none';
    }
  }

  function hideVersionOptions() {
    var versionDropdown = document.getElementById('versionDropdown');
    versionDropdown.style.display = 'none';
  }

  function updateProductVersionOptions() {
    var productButton = document.getElementById('productButton');
    var versionButton = document.getElementById('versionButton');
    var versionDropdown = document.getElementById('versionDropdown');
    var product = productButton.textContent.trim();

    if (product === 'TrueNAS' || product === 'TrueCommand') {
      var label = hasSwitcher() ? window.VersionSwitcher.labelFor(window.location.pathname) : '';
      selectProduct(product);
      if (label) {
        versionButton.innerHTML = label + ' <i class="fa fa-angle-down"></i>';
      }
      versionDropdown.style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', updateProductVersionOptions);

  // Back/forward can restore this page from the browser cache with the label selectVersion set before
  // it navigated away. Scripts do not re-run on a restore, so recompute the labels from the URL.
  window.addEventListener('pageshow', function (event) {
    if (event.persisted) {
      updateDropdownPlaceholderText();
      updateProductVersionOptions();
    }
  });

  // Once the served registry (/docs/versions.json) has loaded, refresh the labels and menu from it.
  if (hasSwitcher()) {
    window.VersionSwitcher.loadRegistry().then(function () {
      updateDropdownPlaceholderText();
      updateProductVersionOptions();
    });
  }
</script>
