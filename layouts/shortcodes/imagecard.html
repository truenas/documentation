<a class="section-box" href="{{ .Get "link" }}">
  <div class="box-image">
    {{ with .Get "icon" }}
      <span class="material-icons prod-card-icon" aria-label="{{ $.Get "title" | plainify }} Documentation Page">{{ . }}</span>
    {{ else }}
      <img class="prod-card-img" src="{{ .Get "image" }}" aria-label="{{ .Get "title" | plainify }} Documentation Page">
    {{ end }}
  </div>
  <div class="section-tab-content ixprods">
    <b style="justify-content:center;font-size:1.5rem;font-weight:600;">{{ .Get "title" | safeHTML }}</b>
    <p>{{ .Get "descr" }}</p>
  </div>
</a>
